
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alfred</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", Arial, sans-serif;
    background:
      radial-gradient(circle at top left, rgba(128, 0, 255, 0.18), transparent 35%),
      radial-gradient(circle at bottom right, rgba(89, 0, 255, 0.12), transparent 35%),
      #07050b;
    color: #fff;

    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }

  .container {
    width: 100%;
    max-width: 750px;
    background: rgba(15, 10, 23, 0.9);
    border: 1px solid rgba(157, 78, 255, 0.35);
    border-radius: 22px;
    padding: 24px;
    box-shadow:
      0 0 40px rgba(125, 45, 255, 0.12),
      inset 0 0 30px rgba(125, 45, 255, 0.03);
    backdrop-filter: blur(15px);
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 20px;
  }

  .logo {
    width: 52px;
    height: 52px;
    border-radius: 15px;
    display: flex;
    align-items: center;
    justify-content: center;

    background: linear-gradient(135deg, #7c3aed, #4c1d95);
    box-shadow: 0 0 25px rgba(124, 58, 237, 0.45);

    font-size: 26px;
  }

  .header-text h2 {
    margin: 0;
    font-size: 22px;
    letter-spacing: 0.5px;
  }

  .status {
    margin-top: 4px;
    color: #a78bfa;
    font-size: 12px;
  }

  .status::before {
    content: "";
    display: inline-block;
    width: 7px;
    height: 7px;
    background: #a855f7;
    border-radius: 50%;
    margin-right: 6px;
    box-shadow: 0 0 10px #a855f7;
  }

  /* Chat */
  #chat {
    height: 500px;
    overflow-y: auto;
    padding: 18px;

    background: rgba(5, 3, 9, 0.75);
    border: 1px solid rgba(139, 92, 246, 0.18);
    border-radius: 16px;

    scrollbar-width: thin;
    scrollbar-color: #6d28d9 #0b0810;
  }

  #chat::-webkit-scrollbar {
    width: 7px;
  }

  #chat::-webkit-scrollbar-track {
    background: #0b0810;
    border-radius: 10px;
  }

  #chat::-webkit-scrollbar-thumb {
    background: #5b21b6;
    border-radius: 10px;
  }

  .msg {
    max-width: 80%;
    margin: 12px 0;
    padding: 12px 15px;
    border-radius: 14px;
    line-height: 1.5;
    font-size: 14px;
    word-wrap: break-word;
    animation: messageIn 0.2s ease-out;
  }

  @keyframes messageIn {
    from {
      opacity: 0;
      transform: translateY(5px);
    }

    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .user {
    margin-left: auto;
    background: linear-gradient(135deg, #6d28d9, #4c1d95);
    border: 1px solid rgba(167, 139, 250, 0.25);
    color: #fff;
    border-bottom-right-radius: 4px;
    box-shadow: 0 5px 18px rgba(109, 40, 217, 0.15);
  }

  .alfred {
    margin-right: auto;
    background: rgba(31, 20, 45, 0.9);
    border: 1px solid rgba(139, 92, 246, 0.18);
    color: #ddd6fe;
    border-bottom-left-radius: 4px;
  }

  /* Input area */
  .input-area {
    display: flex;
    gap: 10px;
    margin-top: 14px;
  }

  input {
    flex: 1;
    min-width: 0;

    padding: 14px 16px;
    border-radius: 12px;
    border: 1px solid rgba(139, 92, 246, 0.3);
    outline: none;

    background: #0c0911;
    color: #fff;
    font-size: 14px;

    transition: 0.2s ease;
  }

  input::placeholder {
    color: #71697c;
  }

  input:focus {
    border-color: #8b5cf6;
    box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
  }

  button {
    width: 100px;
    border: none;
    border-radius: 12px;

    background: linear-gradient(135deg, #8b5cf6, #6d28d9);
    color: white;

    font-weight: 600;
    cursor: pointer;

    box-shadow: 0 5px 20px rgba(109, 40, 217, 0.25);
    transition: all 0.2s ease;
  }

  button:hover {
    transform: translateY(-1px);
    box-shadow: 0 7px 25px rgba(139, 92, 246, 0.4);
  }

  button:active {
    transform: translateY(0);
  }

  /* Mobile */
  @media (max-width: 600px) {
    body {
      padding: 10px;
    }

    .container {
      padding: 15px;
      border-radius: 17px;
    }

    #chat {
      height: 65vh;
    }

    .msg {
      max-width: 90%;
    }

    button {
      width: 85px;
    }
  }
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="logo">🦇</div>

    <div class="header-text">
      <h2>Alfred</h2>
      <div class="status">System Online</div>
    </div>
  </div>

  <div id="chat"></div>

  <div class="input-area">
    <input id="input" placeholder="Talk to Alfred..." />
    <button onclick="send()">Send</button>
  </div>

</div>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');

function addMsg(text, cls) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.textContent = (cls === 'user' ? 'You: ' : 'Alfred: ') + text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function send() {
  const text = input.value.trim();
  if (!text) return;
  addMsg(text, 'user');
  input.value = '';
  const res = await fetch('/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message: text })
  });
  const data = await res.json();
  addMsg(data.reply, 'alfred');
}

input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
</script>

</body>
</html>
